<!-- homepage gallery -->
<div class="container">
  <div class="row g-3 frontpage-gallery-row">
    {% for item in carousel %}
      <div class="col-12 col-sm-6 col-lg-4">
        <a class="card h-100 frontpage-gallery" href="{{ pathto(item.url, 1) }}">
          <div class="frontpage-gallery-img">
            <img src="{{ item.img if item.img.startswith('http') else pathto('_static/' + item.img, 1) }}" alt="{{ item.alt }}" loading="lazy">
          </div>
          <div class="card-body">
            <p class="h5 card-title mb-1">{{ item.title }}</p>
            <p class="card-text mb-0">{{ item.text }}</p>
          </div>
        </a>
      </div>
    {% endfor %}
  </div>
</div>
<!-- institutions -->
<div class="container my-4">
  <p class="h4 text-center font-weight-light">Supporting institutions</p>
  <div id="institution-logos" class="d-flex flex-wrap flex-row justify-content-center align-items-center">
    {% for inst in institutions -%}
      <div class="card my-1 mx-2 {{ inst.klass }}" style="{{ 'width: ' + inst.size + 'rem;' }}">
        <a href="{{ inst.url }}">
          <img class="card-img institution" src="{{ pathto('_static/' + inst.img, 1) }}" title="{{ inst.name }}" alt="{{ inst.name }}"/>
        </a>
      </div>
    {% endfor %}
  </div>
</div>

name: Docs

on:
  push:
    branches: [ main, dev, 'dev/*' ]
    tags: [ 'v*' ]        # release docs, deployed to /<version>/
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Cancel superseded builds of the same PR; never cancel builds of main/dev.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[docs]"

    # The example datasets are downloaded to ~/.whobpyt/data by the fetchers.
    - name: Restore cached example datasets
      uses: actions/cache@v4
      with:
        path: ~/.whobpyt/data
        key: ${{ runner.os }}-whobpyt-data-v1      # bump to v2 if you need a fresh copy
        restore-keys: |
          ${{ runner.os }}-whobpyt-data-

    # Sphinx-gallery only re-runs an example when its script has changed, so
    # caching its outputs makes most builds much faster. The cache is keyed on
    # the library code and requirements: if those change, every example is re-run.
    - name: Restore cached gallery outputs
      uses: actions/cache@v4
      with:
        path: |
          doc/auto_examples
          doc/generated
        key: ${{ runner.os }}-gallery-${{ hashFiles('whobpyt/**', 'pyproject.toml') }}-${{ hashFiles('examples/**') }}
        restore-keys: |
          ${{ runner.os }}-gallery-${{ hashFiles('whobpyt/**', 'pyproject.toml') }}-

    # If this step fails (a Sphinx error or an example that raises an
    # exception), the job fails and nothing is deployed.
    - name: Build docs
      working-directory: doc
      run: make html SPHINXOPTS="-T --keep-going"

    - name: Upload built site
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: doc/_build/html
        retention-days: 7

    - name: Deploy Docs
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/html
        keep_files: true   # keep the pr-* preview folders

    # A release tag (e.g. v0.1.0) also gets a frozen copy of its docs at
    # /0.1.0/. Add the version to doc/_static/versions.json on main so it
    # appears in the version switcher.
    - name: Work out the release version
      id: release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Deploy release docs
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/html
        destination_dir: ${{ steps.release.outputs.version }}
        keep_files: true

    # PRs from forks can't push to gh-pages, so previews are only made for
    # branches in this repository.
    - name: Deploy PR Preview
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/html
        destination_dir: pr-${{ github.event.pull_request.number }}
        keep_files: true

    - name: Comment PR Preview URL
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const previewUrl = `https://griffithslab.github.io/whobpyt/pr-${pr.number}/`;
          const body = `📖 **Documentation preview** for this PR is available at:\n${previewUrl}\n\n_This preview will be updated as you push new commits to this PR._`;

          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
          });

          const botComment = comments.data.find(c =>
            c.user.type === 'Bot' && c.body.includes('Documentation preview')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
          }

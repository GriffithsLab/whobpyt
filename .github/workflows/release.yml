name: Release

# Publishes WhoBPyT to PyPI when a version tag such as v0.1.0 is pushed.
#
# One-time setup on PyPI (no API token needed): add a "trusted publisher" for
# this repository at https://pypi.org/manage/account/publishing/ with
#   owner: GriffithsLab, repository: whobpyt,
#   workflow: release.yml, environment: pypi
# and create an environment called "pypi" in the repository settings.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('whobpyt/__init__.py').read()).group(1))")
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match whobpyt.__version__ ${version}" >&2
          exit 1
        fi

    - name: Build
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # for PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
